<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload</title>
</head>
<body>
    <h1>Upload Transactions CSV</h1>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="csv_file">
        <label for="statement_types">Select Statement Type:</label>
        <select name="statement_types" id="statement_types">
            <option value="hsbc_current">HSBC Current</option>
            <option value="hsbc_credit">HSBC Credit</option>
            <option value="amex">AMEX</option>
            <option value="legacy">Legacy Excel</option>
        </select>
        <button type="submit">Upload</button>
    </form>
</body>
</html>
