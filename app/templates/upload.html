{% extends "base.html" %}

{% block content %}
    <div class="card">
        <div class="card-body">
            <h1 class="card-title mb-4">Upload Statement</h1>
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="csv_file" class="form-label">Choose statement file</label>
                    <input type="file" name="csv_file" id="csv_file" class="form-control" accept=".csv,.xlsx,.xls" required>
                </div>
                <div class="mb-3">
                    <label for="statement_types" class="form-label">Select statement type</label>
                    <select name="statement_types" id="statement_types">
                        <option value="" selected disabled>-- Select statement type --</option>
                        <option value="hsbc_current">HSBC Current</option>
                        <option value="hsbc_credit">HSBC Credit</option>
                        <option value="amex">AMEX</option>
                        <option value="hsbc_savings">HSBC Savings</option>
                        <option value="legacy">Legacy Excel</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Upload</button>
            </form>
        </div>
    </div>
{% endblock %}
