<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('main.home') }}">
                Spending Tracker
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a
                            class="nav-link {% if request.endpoint == 'main.home' %}active{% endif %}"
                            href="{{ url_for('main.home') }}"
                        >
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link {% if request.endpoint == 'main.upload' %}active{% endif %}"
                            href="{{ url_for('main.upload') }}"
                        >
                            Upload
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link {% if request.endpoint == 'main.summary' %}active{% endif %}"
                            href="{{ url_for('main.summary') }}"
                        >
                            Summary
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link {% if request.endpoint == 'main.transactions' %}active{% endif %}"
                            href="{{ url_for('main.transactions') }}"
                        >
                            Transactions
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link {% if request.endpoint == 'main.categorise' %}active{% endif %}"
                            href="{{ url_for('main.categorise') }}"
                        >
                            Categorise
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
</body>
</html>
